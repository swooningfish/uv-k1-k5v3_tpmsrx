name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tpmsrx
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build app and run host tests
        run: bash ./build-docker.sh

      - name: Summary
        run: |
          for f in build/tpms_*.bin; do
            echo "$f: $(wc -c < "$f") B of 4096 B code" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: TPMSRX
          path: build/*.app
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: TPMSRX
          path: .

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          apps=(*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            while IFS= read -r found; do
              cp "$found" .
            done < <(find . -name '*.app' -print)
            apps=(*.app)
          fi
          zips=()
          for app in "${apps[@]}"; do
            base=$(basename "$app" .app)
            # GitHub rejects a release asset whose name ends in .app.
            zip -q "$base.zip" "$app"
            zips+=("$base.zip")
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${zips[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${zips[@]}" --generate-notes
          fi
